<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tutor Algebraico Adaptativo v4.1 | Analítica Pedagógica</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
<style>
:root { --primary: #4f46e5; --bg: #f8fafc; }
body { font-family: 'Outfit', sans-serif; background-color: var(--bg); color: #1e293b; }
.glass { background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.5); }
.feedback-top { position: relative; top: -20px; margin-bottom: 20px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const { useState, useEffect, useRef } = React;

// --- TAXONOMÍA DE ERRORES ---
const ERROR_TAXONOMY = {
"E1a": "Error de Jerarquía",
"E1b": "Error de Agrupación",
"E2a": "Error de Signos",
"E2b": "Error de Exponentes/Radicales",
"E2c": "Error de Coeficiente",
"E3a": "Error de Sintaxis",
"E3b": "Error Lógico",
"E4a": "Error de Estilo",
"E4b": "Error de Comprensión"
};

// --- NORMALIZADOR ---
const normalizeExpression = (str) => {
return str.replace(/\s/g, '')
.replace(/√\(/g, 'sqrt(')
.replace(/√(\w)/g, 'sqrt($1)')
.replace(/sqrt\((.*?)\)/g, 'sqrt($1)')
.replace(/\^(\d+)/g, '^$1')
.replace(/²/g, '^2').replace(/³/g, '^3');
};

// --- COMPONENTE PRINCIPAL ---
function App() {
const [input, setInput] = useState('');
const [feedback, setFeedback] = useState(null);
const [logs, setLogs] = useState([]);
const [view, setView] = useState('student');
const inputRef = useRef(null);

const evaluate = () => {
const cleanInput = normalizeExpression(input);
const correctAnswer = normalizeExpression('(x+5)/2');
const isCorrect = cleanInput === correctAnswer;
let errorType = "E0";

if (!isCorrect) {
if (cleanInput.includes('sqrt')) errorType = "E2b";
else if (cleanInput.includes('+') && !cleanInput.includes('/')) errorType = "E2a";
else if ((cleanInput.match(/\(/g) || []).length !== (correctAnswer.match(/\(/g) || []).length) errorType = "E3a";
else errorType = "E3b";
}

setFeedback(isCorrect ? {
type: 'success',
msg: "¡Excelente! Tu expresión algebraica es correcta."
} : {
type: 'error',
category: errorType,
msg: ERROR_TAXONOMY[errorType]
});

const newLog = { input, result: isCorrect ? 'Correcto' : 'Incorrecto', errorCategory: errorType };
setLogs([newLog, ...logs]);
};

useEffect(() => {
if (view === 'teacher') {
const ctx = document.getElementById('errorChart').getContext('2d');
const errorCounts = logs.reduce((acc, l) => {
if(l.errorCategory!=='E0') acc[l.errorCategory] = (acc[l.errorCategory]||0)+1;
return acc;
}, {});
new Chart(ctx, {
type: 'pie',
data: {
labels: Object.keys(errorCounts),
datasets: [{
data: Object.values(errorCounts),
backgroundColor: ['#ef4444','#f59e0b','#3b82f6','#8b5cf6','#10b981']
}]
}
});
}
}, [view, logs]);

return (
<div className="min-h-screen p-10">
<nav className="flex justify-between mb-10">
<button onClick={()=>setView('student')} className="bg-indigo-600 text-white px-6 py-2 rounded-xl">Vista Estudiante</button>
<button onClick={()=>setView('teacher')} className="bg-emerald-600 text-white px-6 py-2 rounded-xl">Panel Docente</button>
</nav>

{view==='student' && (
<div className="glass p-10 rounded-[2.5rem] shadow-xl max-w-xl mx-auto">
<label className="block text-slate-700 font-bold mb-4">Ejercicio: (x + 5) / 2</label>
<input ref={inputRef} value={input} onChange={(e)=>setInput(e.target.value)}
className="w-full bg-slate-50 border-2 border-slate-200 p-4 rounded-2xl text-xl font-mono text-indigo-600 focus:border-indigo-400 outline-none transition-all mb-4"
placeholder="Escribe tu expresión algebraica..." />
<button onClick={evaluate} className="w-full bg-indigo-600 text-white font-bold py-3 rounded-2xl hover:bg-indigo-700 transition-all">Evaluar</button>

{feedback && (
<div className={`feedback-top mt-6 p-6 rounded-2xl ${feedback.type==='success'?'bg-green-100 text-green-700':'bg-rose-50 border border-rose-200 text-rose-700'}`}>
{feedback.type==='success' ? (
<p className="font-bold text-lg">{feedback.msg}</p>
) : (
<p className="font-bold">{feedback.category}: {feedback.msg}</p>
)}
</div>
)}
</div>
)}

{view==='teacher' && (
<div id="teacher-panel" className="glass p-10 rounded-[2.5rem] shadow-xl">
<h2 className="text-3xl font-black text-slate-800 mb-6">Panel de Analítica Docente</h2>
<div className="grid grid-cols-1 md:grid-cols-2 gap-8">
<div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
<h3 className="font-black text-slate-800 mb-4 uppercase text-sm border-b pb-2 tracking-widest">Distribución de Errores</h3>
<canvas id="errorChart" height="200"></canvas>
</div>
<div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
<h3 className="font-black text-slate-800 mb-4 uppercase text-sm border-b pb-2 tracking-widest">Últimos Errores</h3>
<ul className="space-y-2 text-sm text-slate-700">
{logs.map((l,i)=><li key={i}>• {l.errorCategory}: {l.input}</li>)}
</ul>
</div>
</div>
</div>
)}
</div>
);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
