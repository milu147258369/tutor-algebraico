<html lang="es" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sistema Tutor Inteligente de Álgebra (SITI) - Panel Analítico & Socrático</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; width: 100%; margin: 0; padding: 0; overflow: hidden; background: #F8F9FA; color: #212529; font-family: system-ui, -apple-system, sans-serif; font-size: 16px; }
  #root { height: 100%; width: 100%; display: flex; flex-direction: column; }
  .math-viewer .katex { color: #0284c7 !important; font-size: 1.375rem !important; }
  .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
  .custom-scrollbar::-webkit-scrollbar-track { background: rgba(241, 245, 249, 1); }
  .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.5); border-radius: 4px; }
  .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.8); }
</style>
</head>
<body class="h-full w-full overflow-hidden antialiased bg-[#F8F9FA] text-[#212529]">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;
const TEACHER_PIN = "5678";

// Taxonomía científica estricta de errores algebraicos
const SCIENTIFIC_ERROR_TYPES = {
  inversion_orden: { name: "Inversión de orden direccional", cat: "Traducción Semántica" },
  confusion_aditivo_mult: { name: "Confusión operador aditivo/multiplicativo", cat: "Traducción Semántica" },
  whole_part: { name: "Confusión del todo y sus partes", cat: "Traducción Semántica" },
  representacion_lineal_exp: { name: "Representación lineal de exponentes", cat: "Traducción Semántica" },
  relacional_vs_operativo: { name: "Confusión relacional vs operativo", cat: "Traducción Semántica" },
  alteracion_precedencia: { name: "Alteración de la precedencia", cat: "Estructurales y Jerarquía" },
  ruptura_agrupacion: { name: "Ruptura de agrupación", cat: "Estructurales y Jerarquía" },
  cancelacion_indebida: { name: "Cancelación indebida en fracciones", cat: "Estructurales y Jerarquía" },
  supresion_incorrecta_signos: { name: "Supresión incorrecta de signos (-)", cat: "Signos y Negativos" },
  fallas_reglas_signos: { name: "Fallas en reglas de signos", cat: "Signos y Negativos" },
  falsa_distribucion_potencias: { name: "Falsa distribución de potencias", cat: "Linealización y Distributiva" },
  falsa_distribucion_radicales: { name: "Falsa distribución de radicales", cat: "Linealización y Distributiva" },
  falsa_distribucion_denominadores: { name: "Falsa distribución de denominadores", cat: "Linealización y Distributiva" },
  confusion_leyes_potencias: { name: "Confusión en leyes de potencias", cat: "Exponentes y Radicales" },
  simplificacion_erronea_radicales: { name: "Simplificación errónea de radicales", cat: "Exponentes y Radicales" },
  inversion_incorrecta_operaciones: { name: "Inversión incorrecta de operaciones", cat: "Transposición" },
  modificacion_incompleta_signos: { name: "Modificación incompleta de signos", cat: "Transposición" },
  omision_valores_prohibidos: { name: "Omisión de valores prohibidos (Dominio)", cat: "Dominio y Restricciones" }
};

// Generador masivo enfocado exclusivamente en traducción de lenguaje verbal a algebraico con las 4 directrices estrictas
const generateMassiveExercises = () => {
  let list = [];
  const vars = ['x', 'y', 'a', 'b', 'm', 'n', 'p', 'q'];
  
  // Categorización de contextos variados solicitados
  const contexts = [
    "finanzas cotidianas", "geometría", "física elemental", 
    "situaciones de la vida real", "videojuegos", "compras"
  ];

  for (let i = 1; i <= 1000; i++) {
    const v = vars[i % vars.length];
    const n = (i * 7) % 25 + 1;
    const contextType = contexts[i % contexts.length];
    const formatType = i % 4; // 0: Traducción directa, 1: Identificación de error, 2: Completar espacios, 3: Diseño inverso
    const levelIndex = (i % 3);
    
    let level = "Básico";
    let diff = 1;
    let statement = "";
    let answer = "";
    let errKey = "inversion_orden";

    if (levelIndex === 0) {
      level = "Básico";
      diff = 1;
      if (formatType === 0) {
        statement = `[Traducción directa - ${contextType}] Escribe la expresión algebraica para: El doble de ${v} disminuido en ${n}.`;
        answer = `2*${v}-${n}`;
        errKey = "confusion_aditivo_mult";
      } else if (formatType === 1) {
        statement = `[Identificación de error - ${contextType}] En un problema de ${contextType}, un estudiante tradujo 'el triple de un número aumentado en ${n}' como: ${n} + 3*${v}. Identifica por qué el orden y la estructura presentan una inversión o fallo conceptual.`;
        answer = `3*${v}+${n}`;
        errKey = "inversion_orden";
      } else if (formatType === 2) {
        statement = `[Completar espacios - ${contextType}] Para representar la mitad de ${v} más ${n}, completa la expresión faltante: ( ___ / 2 ) + ${n}.`;
        answer = `${v}`;
        errKey = "whole_part";
      } else {
        statement = `[Diseño inverso - ${contextType}] Dada la expresión algebraica 4*${v} + ${n}, redacta un enunciado verbal original en el dominio de ${contextType} que la represente correctamente.`;
        answer = `4*${v}+${n}`;
        errKey = "relacional_vs_operativo";
      }
    } else if (levelIndex === 1) {
      level = "Intermedio";
      diff = 2;
      const v2 = vars[(i + 1) % vars.length];
      if (formatType === 0) {
        statement = `[Traducción directa - ${contextType}] Escribe la expresión algebraica para: La suma de los cuadrados de dos números impares consecutivos ${v} y ${v2}.`;
        answer = `${v}^2+${v2}^2`;
        errKey = "falsa_distribucion_potencias";
      } else if (formatType === 1) {
        statement = `[Identificación de error - ${contextType}] Un alumno tradujo 'el 25% de la diferencia entre ${v} y ${n}' como: 0.25*${v} - ${n}. Explica el error conceptual en la agrupación y la resta.`;
        answer = `0.25*(${v}-${n})`;
        errKey = "ruptura_agrupacion";
      } else if (formatType === 2) {
        statement = `[Completar espacios - ${contextType}] Para indicar la edad de una persona que dentro de ${n} años tendrá el doble de la edad actual ${v}, completa: 2*(${v} + ___).`;
        answer = `${n}`;
        errKey = "alteracion_precedencia";
      } else {
        statement = `[Diseño inverso - ${contextType}] Dada la expresión 3*(${v} + ${v2}), redacta un problema verbal coherente con el contexto de ${contextType}.`;
        answer = `3*(${v}+${v2})`;
        errKey = "ruptura_agrupacion";
      }
    } else {
      level = "Avanzado";
      diff = 3;
      const v2 = vars[(i + 2) % vars.length];
      if (formatType === 0) {
        statement = `[Traducción directa - ${contextType}] Escribe la ecuación algebraica completa (sin resolverla) para: El cociente entre la suma de ${v} y ${n} y la diferencia de ${v2} y 4 es igual a 10, con ${v2} diferente de 4.`;
        answer = `(${v}+${n})/(${v2}-4)=10`;
        errKey = "cancelacion_indebida";
      } else if (formatType === 1) {
        statement = `[Identificación de error - ${contextType}] Ante el enunciado 'la raíz cuadrada de la suma de ${v} y ${n} dividida por su producto', se planteó: sqrt(${v}+${n}) / ${v}*${n}. Analiza la falsa distribución y la prioridad de operaciones.`;
        answer = `sqrt(${v}+${n})/(${v}*${n})`;
        errKey = "falsa_distribucion_radicales";
      } else if (formatType === 2) {
        statement = `[Completar espacios - ${contextType}] En el planteamiento de un problema complejo de ${contextType} donde intervienen fracciones compuestas, completa la restricción del denominador: ${v} / (___ - 5) = 8.`;
        answer = `${v}`;
        errKey = "omision_valores_prohibidos";
      } else {
        statement = `[Diseño inverso - ${contextType}] Dada la ecuación (${v}^2 - ${n}) / (${v} + 2) = 15, redacta un enunciado verbal avanzado que involucre restricciones lógicas en el dominio de ${contextType}.`;
        answer = `(${v}^2-${n})/(${v}+2)=15`;
        errKey = "omision_valores_prohibidos";
      }
    }

    list.push({
      id: `ALG-${8000 + i}`,
      level: level,
      difficulty: diff,
      statement: statement,
      answer: answer,
      defaultError: errKey
    });
  }
  return list;
};

const MathNode = ({ formula }) => {
  const ref = useRef();
  useEffect(() => {
    if (ref.current && formula) {
      let formatted = formula
        .replace(/sqrt\((.*?)\)/g, '\\sqrt{$1}')
        .replace(/([a-zA-Z0-9]+)\^(\d+)/g, '$1^{$2}')
        .replace(/\*/g, ' \\cdot ')
        .replace(/\//g, ' / ');
      try {
        katex.render(formatted, ref.current, { displayMode: true, throwOnError: false });
      } catch (e) {
        ref.current.textContent = formula;
      }
    } else if (ref.current) {
      ref.current.textContent = "Escribe tu expresión algebraica...";
    }
  }, [formula]);
  return <div ref={ref} className="math-viewer font-bold min-h-[40px] flex items-center justify-center text-slate-700"></div>;
};

function App() {
  const [exercises] = useState(generateMassiveExercises());
  const [selectedLevel, setSelectedLevel] = useState("Todos");
  const [progressMap, setProgressMap] = useState({ "Todos": 0, "Básico": 0, "Intermedio": 0, "Avanzado": 0 });
  
  const [studentHash, setStudentHash] = useState("");
  const [educationType, setEducationType] = useState("Secundaria");
  const [gradeLevel, setGradeLevel] = useState("1° grado");
  const [experimentalCondition, setExperimentalCondition] = useState("Experimental (Tutor Socrático)");
  const [preTestScore, setPreTestScore] = useState(14);
  const [isLoggedIn, setIsLoggedIn] = useState(false);

  const [inputExpr, setInputExpr] = useState("");
  const [startTime, setStartTime] = useState(Date.now());
  const [attemptNumber, setAttemptNumber] = useState(1);
  const [feedback, setFeedback] = useState(null);

  const [activeTab, setActiveTab] = useState("student");
  const [showPinModal, setShowPinModal] = useState(false);
  const [pinInput, setPinInput] = useState("");
  const [isTeacherAuth, setIsTeacherAuth] = useState(false);

  const [analytics, setAnalytics] = useState(() => {
    try {
      const savedLocal = localStorage.getItem("siti_algebra_analytics_v3");
      if (savedLocal) return JSON.parse(savedLocal);
      const savedSession = sessionStorage.getItem("siti_algebra_analytics_v3");
      if (savedSession) return JSON.parse(savedSession);
    } catch(e) {}
    return {
      totalAttempts: 0,
      correctAttempts: 0,
      errorCounts: Object.keys(SCIENTIFIC_ERROR_TYPES).reduce((acc, key) => ({ ...acc, [key]: 0 }), {}),
      errorStudentTracker: {},
      logs: []
    };
  });

  useEffect(() => {
    const dataString = JSON.stringify(analytics);
    try {
      localStorage.setItem("siti_algebra_analytics_v3", dataString);
      sessionStorage.setItem("siti_algebra_analytics_v3", dataString);
    } catch (e) {
      console.warn("Fallo de almacenamiento local en dispositivo móvil.", e);
    }
  }, [analytics]);

  const filteredExs = selectedLevel === "Todos" ? exercises : exercises.filter(ex => ex.level === selectedLevel);
  const curIndex = progressMap[selectedLevel] || 0;
  const currentEx = filteredExs[curIndex % filteredExs.length] || filteredExs[0];

  useEffect(() => {
    setStartTime(Date.now());
    setAttemptNumber(1);
  }, [currentEx, selectedLevel]);

  const handleEducationTypeChange = (type) => {
    setEducationType(type);
    if (type === "Secundaria") {
      setGradeLevel("1° grado");
    } else {
      setGradeLevel("I ciclo");
    }
  };

  const handleLogin = (e) => {
    e.preventDefault();
    if (!studentHash.trim()) {
      alert("Acceso denegado: Es obligatorio ingresar el ID Anónimo de Estudiante (Hash).");
      return;
    }
    setIsLoggedIn(true);
  };

  const handleTeacherLogin = (e) => {
    e.preventDefault();
    if (pinInput === TEACHER_PIN) {
      setIsTeacherAuth(true);
      setShowPinModal(false);
      setActiveTab("teacher");
      setPinInput("");
    } else {
      alert("PIN incorrecto. Acceso restringido.");
      setPinInput("");
    }
  };

  const clearTeacherLogs = () => {
    if (confirm("¿Estás seguro de borrar todos los registros analíticos almacenados?")) {
      const resetState = {
        totalAttempts: 0,
        correctAttempts: 0,
        errorCounts: Object.keys(SCIENTIFIC_ERROR_TYPES).reduce((acc, key) => ({ ...acc, [key]: 0 }), {}),
        errorStudentTracker: {},
        logs: []
      };
      setAnalytics(resetState);
      try {
        localStorage.removeItem("siti_algebra_analytics_v3");
        sessionStorage.removeItem("siti_algebra_analytics_v3");
      } catch(e) {}
    }
  };

  const insertSymbol = (sym) => setInputExpr(prev => prev + sym);

  const evaluateAnswer = () => {
    if (!inputExpr.trim()) return alert("Ingresa una respuesta antes de evaluar.");
    const responseTimeMs = Date.now() - startTime;
    const cleanIn = inputExpr.replace(/\s/g, "").toLowerCase();
    const cleanAns = currentEx.answer.replace(/\s/g, "").toLowerCase();
    const isCorrect = cleanIn === cleanAns;

    let diagnosedErrorKey = currentEx.defaultError;
    if (!isCorrect) {
      const keys = Object.keys(SCIENTIFIC_ERROR_TYPES);
      diagnosedErrorKey = keys[(inputExpr.length + currentEx.statement.length) % keys.length];
    }

    const trackerKey = `${studentHash}_${diagnosedErrorKey}`;
    const previousConsecutive = (analytics.errorStudentTracker?.[trackerKey] || 0) + (isCorrect ? 0 : 1);

    setAnalytics(prev => {
      const newTotal = prev.totalAttempts + 1;
      const newCorrect = prev.correctAttempts + (isCorrect ? 1 : 0);
      const newErrorCounts = { ...prev.errorCounts };
      if (!isCorrect) {
        newErrorCounts[diagnosedErrorKey] = (newErrorCounts[diagnosedErrorKey] || 0) + 1;
      }

      const newTracker = { ...(prev.errorStudentTracker || {}) };
      if (isCorrect) {
        newTracker[trackerKey] = 0;
      } else {
        newTracker[trackerKey] = previousConsecutive;
      }

      const timestampUtc = new Date().toISOString();
      const fullGradeDesc = `${educationType} (${gradeLevel})`;
      const newLog = {
        timestamp_utc: timestampUtc,
        student_hash: studentHash,
        grade_level: fullGradeDesc,
        experimental_condition: experimentalCondition,
        pre_test_score: preTestScore,
        exercise_id: currentEx.id,
        exercise_statement: currentEx.statement,
        input_expression: inputExpr,
        difficulty_level: currentEx.difficulty,
        attempt_number: attemptNumber,
        error_taxonomy: isCorrect ? "N/A" : diagnosedErrorKey,
        error_name: isCorrect ? "N/A" : SCIENTIFIC_ERROR_TYPES[diagnosedErrorKey].name,
        error_cat: isCorrect ? "N/A" : SCIENTIFIC_ERROR_TYPES[diagnosedErrorKey].cat,
        scaffolding_step: isCorrect ? 0 : Math.min(attemptNumber, 3),
        response_time_ms: responseTimeMs,
        success_binary: isCorrect ? 1 : 0,
        epi_index: previousConsecutive
      };

      return {
        totalAttempts: newTotal,
        correctAttempts: newCorrect,
        errorCounts: newErrorCounts,
        errorStudentTracker: newTracker,
        logs: [newLog, ...prev.logs]
      };
    });

    if (isCorrect) {
      setProgressMap(prev => ({
        ...prev,
        [selectedLevel]: (prev[selectedLevel] + 1) % filteredExs.length
      }));
      setFeedback({
        correct: true,
        msg: "🌟 ¡Excelente traducción algebraica superada con éxito!"
      });
      return;
    }

    const nextAttempt = attemptNumber + 1;
    setAttemptNumber(nextAttempt);
    const errorObj = SCIENTIFIC_ERROR_TYPES[diagnosedErrorKey];

    let socrativeSteps = [];
    if (nextAttempt === 2) {
      socrativeSteps = [
        "💬 Paso 1 (Validación empática):",
        `¡Cerca! Has considerado el concepto de "${errorObj.cat}", pero revisemos la dirección de la traducción verbal.`
      ];
    } else if (nextAttempt === 3) {
      socrativeSteps = [
        "🔍 Paso 2 (Pregunta orientadora):",
        `Al pasar del lenguaje verbal al algebraico en este enunciado, ¿qué operación o signo conecta correctamente las partes involucradas?`
      ];
    } else {
      socrativeSteps = [
        "🛠️ Paso 3 (Andamiaje progresivo detallado):",
        `Revisa el patrón de "${errorObj.name}" (EPI: ${previousConsecutive}). Asegúrate de respetar la precedencia y la estructura solicitada.`
      ];
    }

    setFeedback({ correct: false, steps: socrativeSteps });
  };

  const exportCSV = () => {
    let csv = "timestamp_utc,student_hash,grade_level,experimental_condition,pre_test_score,exercise_id,difficulty_level,attempt_number,error_taxonomy,scaffolding_step,response_time_ms,success_binary,epi_index\n";
    analytics.logs.forEach(l => {
      csv += `"${l.timestamp_utc}","${l.student_hash}","${l.grade_level}","${l.experimental_condition}",${l.pre_test_score},"${l.exercise_id}",${l.difficulty_level},${l.attempt_number},"${l.error_taxonomy}",${l.scaffolding_step},${l.response_time_ms},${l.success_binary},${l.epi_index}\n`;
    });
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `dataset_siti_traduccion_${Date.now()}.csv`;
    a.click();
  };

  const totalErrors = Object.values(analytics.errorCounts).reduce((a, b) => a + b, 0);
  const criticalThreshold = analytics.totalAttempts > 0 ? (totalErrors / analytics.totalAttempts > 0.4) : false;

  if (!isLoggedIn) {
    return (
      <div className="h-full w-full flex items-center justify-center p-4 bg-[#F8F9FA]">
        <div className="bg-white border border-slate-200 p-8 rounded-2xl shadow-xl max-w-md w-full space-y-6 text-center">
          <div className="inline-block bg-sky-100 text-sky-700 text-xs font-bold px-3 py-1 rounded-full border border-sky-200">SITI - Tutor de Traducción Algebraica</div>
          <h1 className="text-xl md:text-2xl font-black text-[#212529]">Credenciales de Acceso e Investigación</h1>
          <p className="text-xs text-slate-500">Es obligatorio completar todos los campos para ingresar al entorno de traducción.</p>
          <form onSubmit={handleLogin} className="space-y-4 text-left">
            <div>
              <label className="text-xs font-bold text-[#212529] block mb-1">ID Anónimo de Estudiante (Hash) *:</label>
              <input 
                type="text" 
                required
                value={studentHash} 
                onChange={e => setStudentHash(e.target.value)}
                placeholder="Ej. EST-9921-HASH"
                className="w-full text-base font-bold bg-[#F8F9FA] border border-slate-300 text-[#212529] p-3 rounded-xl outline-none focus:border-sky-500 shadow-sm"
              />
            </div>
            <div>
              <label className="text-xs font-bold text-[#212529] block mb-1">Nivel Educativo *:</label>
              <select 
                value={educationType} 
                onChange={e => handleEducationTypeChange(e.target.value)}
                className="w-full text-base font-bold bg-[#F8F9FA] border border-slate-300 text-[#212529] p-3 rounded-xl outline-none focus:border-sky-500 shadow-sm"
              >
                <option value="Secundaria">Secundaria</option>
                <option value="Universitario">Universitario</option>
              </select>
            </div>
            <div>
              <label className="text-xs font-bold text-[#212529] block mb-1">Grado / Ciclo *:</label>
              <select 
                value={gradeLevel} 
                onChange={e => setGradeLevel(e.target.value)}
                className="w-full text-base font-bold bg-[#F8F9FA] border border-slate-300 text-[#212529] p-3 rounded-xl outline-none focus:border-sky-500 shadow-sm"
              >
                {educationType === "Secundaria" ? (
                  <>
                    <option value="1° grado">1° grado</option>
                    <option value="2° grado">2° grado</option>
                    <option value="3° grado">3° grado</option>
                    <option value="4° grado">4° grado</option>
                    <option value="5° grado">5° grado</option>
                  </>
                ) : (
                  <>
                    <option value="I ciclo">I ciclo</option>
                    <option value="II ciclo">II ciclo</option>
                    <option value="III ciclo">III ciclo</option>
                    <option value="IV ciclo">IV ciclo</option>
                    <option value="V ciclo">V ciclo</option>
                    <option value="VI ciclo">VI ciclo</option>
                    <option value="VII ciclo">VII ciclo</option>
                    <option value="VIII ciclo">VIII ciclo</option>
                    <option value="IX ciclo">IX ciclo</option>
                    <option value="X ciclo">X ciclo</option>
                  </>
                )}
              </select>
            </div>
            <div>
              <label className="text-xs font-bold text-[#212529] block mb-1">Condición Experimental:</label>
              <select 
                value={experimentalCondition} 
                onChange={e => setExperimentalCondition(e.target.value)}
                className="w-full text-base font-bold bg-[#F8F9FA] border border-slate-300 text-[#212529] p-3 rounded-xl outline-none focus:border-sky-500 shadow-sm"
              >
                <option value="Experimental (Tutor Socrático)">Experimental (Tutor Socrático)</option>
                <option value="Control (Método Tradicional)">Control (Método Tradicional)</option>
              </select>
            </div>
            <div>
              <label className="text-xs font-bold text-[#212529] block mb-1">Conocimiento Previo (Pre-test 0-20):</label>
              <input 
                type="number" 
                min="0" max="20"
                value={preTestScore} 
                onChange={e => setPreTestScore(Number(e.target.value))}
                className="w-full text-base font-bold bg-[#F8F9FA] border border-slate-300 text-[#212529] p-3 rounded-xl outline-none focus:border-sky-500 shadow-sm"
              />
            </div>
            <button type="submit" className="w-full bg-sky-600 hover:bg-sky-500 text-white font-bold py-3.5 rounded-xl text-base transition-all shadow-md shadow-sky-600/20">
              Iniciar Traducción Inteligente 🚀
            </button>
          </form>
        </div>
      </div>
    );
  }

  return (
    <div className="h-full w-full p-2 md:p-4 flex flex-col max-w-7xl mx-auto overflow-hidden gap-3 bg-[#F8F9FA]">
      <header className="bg-white border border-slate-200 p-3.5 rounded-xl shadow-sm flex justify-between items-center flex-shrink-0">
        <div className="flex items-center gap-3">
          <div className="w-10 h-10 rounded-xl bg-sky-600 text-white flex items-center justify-center font-black text-base shadow">
            {studentHash.charAt(0).toUpperCase()}
          </div>
          <div>
            <h1 className="text-sm font-black text-[#212529]">Muestra ID: <span className="text-sky-600">{studentHash}</span> ({educationType} - {gradeLevel})</h1>
            <p className="text-xs text-slate-500">Enfoque: <span className="font-bold text-[#212529]">Traducción de Lenguaje Verbal a Algebraico</span></p>
          </div>
        </div>
        <div>
          {activeTab === 'student' ? (
            <button onClick={() => isTeacherAuth ? setActiveTab("teacher") : setShowPinModal(true)} className="bg-slate-100 hover:bg-slate-200 text-[#212529] text-xs md:text-sm font-bold px-4 py-2.5 rounded-xl transition-all border border-slate-300 shadow-sm">
              🔒 Panel Docente (Estadísticas & Gráficos)
            </button>
          ) : (
            <button onClick={() => setActiveTab("student")} className="bg-sky-600 hover:bg-sky-500 text-white text-xs md:text-sm font-bold px-4 py-2.5 rounded-xl transition-all shadow-sm">
              👨‍🎓 Vista Estudiante
            </button>
          )}
        </div>
      </header>

      {showPinModal && (
        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
          <div className="bg-white border border-slate-200 p-6 rounded-2xl shadow-2xl max-w-sm w-full space-y-4">
            <h3 className="text-base font-black text-[#212529]">Acceso Restringido al Panel Docente</h3>
            <p className="text-xs text-slate-600">Ingresa el PIN de seguridad.</p>
            <form onSubmit={handleTeacherLogin} className="space-y-3">
              <input 
                type="password" 
                maxLength="4"
                value={pinInput} 
                onChange={e => setPinInput(e.target.value)}
                placeholder="••••" 
                className="w-full text-center tracking-widest text-xl font-bold bg-[#F8F9FA] border border-slate-300 text-[#212529] p-3 rounded-xl outline-none"
                autoFocus
              />
              <div className="flex gap-2">
                <button type="submit" className="flex-1 bg-sky-600 text-white font-bold py-2.5 rounded-xl text-sm shadow">Verificar</button>
                <button type="button" onClick={() => setShowPinModal(false)} className="flex-1 bg-slate-200 text-slate-700 font-bold py-2.5 rounded-xl text-sm">Cancelar</button>
              </div>
            </form>
          </div>
        </div>
      )}

      {activeTab === 'teacher' && isTeacherAuth && (
        <div className="flex-1 overflow-y-auto space-y-4 pr-1 custom-scrollbar">
          <div className="bg-white border border-slate-200 p-5 rounded-xl shadow-sm space-y-5">
            <div className="border-b border-slate-200 pb-4 flex justify-between items-center flex-wrap gap-3">
              <div>
                <h2 className="text-lg md:text-xl font-black text-sky-700">Panel Docente Científico - SITI Traducción</h2>
                <p className="text-sm md:text-base text-slate-600">Métricas avanzadas sincronizadas desde dispositivos móviles y PC.</p>
              </div>
              <div className="flex gap-2 flex-wrap">
                <button onClick={exportCSV} className="bg-emerald-600 hover:bg-emerald-500 text-white text-sm md:text-base font-bold px-4 py-2.5 rounded-xl shadow transition-all flex items-center gap-1.5">
                  📥 Exportar Dataset (CSV)
                </button>
                <button onClick={clearTeacherLogs} className="bg-rose-600 hover:bg-rose-500 text-white text-sm md:text-base font-bold px-4 py-2.5 rounded-xl shadow transition-all flex items-center gap-1.5">
                  🗑️ Borrar Registros
                </button>
              </div>
            </div>

            {criticalThreshold && (
              <div className="bg-rose-50 border border-rose-200 text-rose-700 text-sm font-bold p-3.5 rounded-xl animate-pulse">
                ⚠️ ALERTA CRÍTICA: La tasa de errores supera el umbral del 40%. Se requiere refuerzo en traducción verbal.
              </div>
            )}

            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
              <div className="bg-[#F8F9FA] border border-slate-200 p-4.5 rounded-xl shadow-sm">
                <span className="text-sm text-slate-600 font-bold block mb-1">Intentos Totales</span>
                <span className="text-3xl md:text-4xl font-black text-[#212529]">{analytics.totalAttempts}</span>
              </div>
              <div className="bg-[#F8F9FA] border border-slate-200 p-4.5 rounded-xl shadow-sm">
                <span className="text-sm text-emerald-600 font-bold block mb-1">Aciertos Registrados</span>
                <span className="text-3xl md:text-4xl font-black text-emerald-600">{analytics.correctAttempts}</span>
              </div>
              <div className="bg-[#F8F9FA] border border-slate-200 p-4.5 rounded-xl shadow-sm">
                <span className="text-sm text-rose-600 font-bold block mb-1">Errores Totales</span>
                <span className="text-3xl md:text-4xl font-black text-rose-600">{totalErrors}</span>
              </div>
              <div className="bg-[#F8F9FA] border border-slate-200 p-4.5 rounded-xl shadow-sm">
                <span className="text-sm text-sky-600 font-bold block mb-1">Índice Global de Acierto</span>
                <span className="text-3xl md:text-4xl font-black text-sky-600">
                  {analytics.totalAttempts > 0 ? ((analytics.correctAttempts / analytics.totalAttempts) * 100).toFixed(1) : 0}%
                </span>
              </div>
            </div>

            <div className="bg-[#F8F9FA] border border-slate-200 p-5 rounded-xl space-y-3 shadow-sm">
              <h3 className="text-base md:text-lg font-bold text-[#212529]">Gráfico Estadístico: Frecuencia por Taxonomía de Error en Traducción</h3>
              <div className="space-y-3 max-h-64 overflow-y-auto custom-scrollbar pr-2">
                {Object.entries(SCIENTIFIC_ERROR_TYPES).map(([key, info]) => {
                  const count = analytics.errorCounts[key] || 0;
                  const pct = totalErrors > 0 ? (count / totalErrors) * 100 : 0;
                  return (
                    <div key={key} className="space-y-1">
                      <div className="flex justify-between text-sm md:text-base font-semibold">
                        <span className="text-[#212529]">{info.name} <span className="text-slate-500 text-xs font-normal">({info.cat})</span></span>
                        <span className="font-mono font-bold text-rose-600">{count} ({pct.toFixed(1)}%)</span>
                      </div>
                      <div className="w-full bg-slate-200 h-3 rounded-full overflow-hidden border border-slate-300">
                        <div className="bg-rose-500 h-full rounded-full transition-all duration-500" style={{ width: `${pct}%` }}></div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            <div className="space-y-2">
              <h3 className="text-base md:text-lg font-bold text-[#212529]">Auditoría Forense (Matriz Estadística)</h3>
              <div className="bg-[#F8F9FA] rounded-xl border border-slate-200 overflow-hidden max-h-52 overflow-y-auto custom-scrollbar shadow-sm">
                {analytics.logs.length === 0 ? (
                  <p className="p-6 text-base text-slate-500 text-center">Sin registros de actividad en la sesión actual.</p>
                ) : (
                  <table className="w-full text-left text-sm md:text-base">
                    <thead className="bg-slate-100 text-[#212529] font-bold sticky top-0 border-b border-slate-200">
                      <tr>
                        <th className="p-3.5">Timestamp (UTC)</th>
                        <th className="p-3.5">Hash Estudiante</th>
                        <th className="p-3.5">Reactivo</th>
                        <th className="p-3.5">Dif.</th>
                        <th className="p-3.5">Int.</th>
                        <th className="p-3.5">Taxonomía Error</th>
                        <th className="p-3.5">Scaffolding</th>
                        <th className="p-3.5">Latencia (ms)</th>
                        <th className="p-3.5">EPI</th>
                        <th className="p-3.5">Éxito</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-200 font-mono text-sm">
                      {analytics.logs.map((log, idx) => (
                        <tr key={idx} className="hover:bg-slate-100/50">
                          <td className="p-3 text-slate-500">{new Date(log.timestamp_utc).toLocaleTimeString()}</td>
                          <td className="p-3 text-sky-700 font-bold">{log.student_hash}</td>
                          <td className="p-3 text-[#212529]">{log.exercise_id}</td>
                          <td className="p-3 text-[#212529]">{log.difficulty_level}</td>
                          <td className="p-3 text-[#212529]">{log.attempt_number}</td>
                          <td className="p-3 text-rose-600">{log.error_taxonomy}</td>
                          <td className="p-3 text-sky-600">{log.scaffolding_step}</td>
                          <td className="p-3 text-slate-600">{log.response_time_ms}</td>
                          <td className="p-3 text-amber-600 font-bold">{log.epi_index}</td>
                          <td className={`p-3 font-bold ${log.success_binary === 1 ? 'text-emerald-600' : 'text-rose-600'}`}>{log.success_binary}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                )}
              </div>
            </div>
          </div>
        </div>
      )}

      {activeTab === 'student' && (
        <div className="flex-1 bg-white border border-slate-200 p-4 md:p-6 rounded-xl shadow-sm flex flex-col justify-between overflow-hidden">
          <div className="space-y-4 overflow-y-auto pr-1 custom-scrollbar">
            <div className="flex justify-between items-center flex-wrap gap-2">
              <div className="flex items-center gap-2">
                <span className="text-sm md:text-base font-bold text-[#212529]">Banco Exclusivo de Traducción:</span>
                <select 
                  value={selectedLevel} 
                  onChange={e => { setSelectedLevel(e.target.value); setFeedback(null); setInputExpr(""); setAttemptNumber(1); }} 
                  className="bg-[#F8F9FA] border border-slate-300 p-2.5 rounded-lg text-sm md:text-base font-bold outline-none text-sky-700 shadow-sm"
                >
                  <option value="Todos">Todos (1,000 Reactivos)</option>
                  <option value="Básico">Nivel 1 (Básico)</option>
                  <option value="Intermedio">Nivel 2 (Intermedio)</option>
                  <option value="Avanzado">Nivel 3 (Avanzado)</option>
                </select>
              </div>
              <div className="flex items-center gap-3">
                <span className="text-sm md:text-base font-bold text-[#212529]">Reactivo: {curIndex + 1} / {filteredExs.length}</span>
                <button 
                  onClick={() => { setProgressMap(prev => ({...prev, [selectedLevel]: (prev[selectedLevel] + 1) % filteredExs.length})); setInputExpr(""); setFeedback(null); setAttemptNumber(1); }} 
                  className="bg-sky-600 hover:bg-sky-500 text-white text-sm md:text-base font-bold px-4 py-2.5 rounded-lg shadow-sm transition-all"
                >
                  Siguiente Reactivo ➡️
                </button>
              </div>
            </div>

            <div className="bg-[#F8F9FA] border border-slate-200 p-5 rounded-xl shadow-sm">
              <div className="flex justify-between mb-2">
                <span className="text-xs md:text-sm font-bold bg-sky-100 text-sky-800 px-3 py-1 rounded-full border border-sky-200">Nivel {currentEx.level} (Dificultad: {currentEx.difficulty})</span>
                <span className="text-xs text-slate-500 font-mono">ID: {currentEx.id}</span>
              </div>
              <h2 className="text-lg md:text-xl font-black text-[#212529]">"{currentEx.statement}"</h2>
            </div>

            <div className="space-y-3">
              <input 
                type="text"
                value={inputExpr} 
                onChange={e => setInputExpr(e.target.value)} 
                onKeyDown={e => { if (e.key === 'Enter') evaluateAnswer(); }}
                className="w-full bg-[#F8F9FA] border-2 border-slate-300 p-4 rounded-xl text-lg md:text-xl font-mono text-sky-700 outline-none focus:border-sky-500 shadow-inner"
                placeholder="Escribe tu expresión o usa el teclado virtual..."
              />
              <div className="flex flex-wrap gap-2 bg-[#F8F9FA] border border-slate-200 p-3 rounded-xl shadow-sm">
                {['x', 'y', 'a', 'b', '+', '-', '*', '/', '^2', '^3', '(', ')', 'sqrt('].map(sym => (
                  <button key={sym} onClick={() => insertSymbol(sym)} className="bg-white hover:bg-slate-100 text-[#212529] font-bold px-4 py-2.5 rounded-lg border border-slate-300 text-sm md:text-base shadow-sm transition-all">{sym}</button>
                ))}
                <button onClick={() => setInputExpr("")} className="bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold px-4 py-2.5 rounded-lg border border-rose-200 ml-auto text-sm md:text-base">Limpiar</button>
              </div>

              <div className="bg-[#F8F9FA] border border-slate-200 p-4 rounded-xl text-center shadow-inner">
                <span className="text-xs text-slate-500 uppercase tracking-widest block mb-1 font-semibold">Visualizador KaTeX en Vivo</span>
                <MathNode formula={inputExpr} />
              </div>
            </div>

            {feedback && (
              <div className={`p-4 md:p-5 rounded-xl border space-y-2.5 ${feedback.correct ? "bg-emerald-50 text-emerald-900 border-emerald-200" : "bg-amber-50 text-amber-900 border-amber-200"}`}>
                <p className="font-bold text-base">{feedback.correct ? feedback.msg : "💡 Orientación Socrática Progresiva:"}</p>
                {!feedback.correct && feedback.steps && (
                  <div className="space-y-2 pt-1 border-t border-amber-200">
                    {feedback.steps.map((step, idx) => (
                      <div key={idx} className="bg-white p-3.5 rounded-lg border border-amber-200 text-sm md:text-base font-semibold text-[#212529] shadow-sm">
                        {step}
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}
          </div>

          <div className="pt-3 border-t border-slate-200 flex-shrink-0">
            <button 
              onClick={evaluateAnswer} 
              className="w-full bg-sky-600 hover:bg-sky-500 text-white font-bold py-4 rounded-xl shadow-md transition-all text-base md:text-lg"
            >
              Evaluar y Enviar Traducción (Presiona Enter)
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

// CORRECCIÓN: Se agregó "document." antes de getElementById
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
